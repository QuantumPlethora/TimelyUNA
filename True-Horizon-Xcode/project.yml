name: TrueHorizon
options:
  bundleIdPrefix: com.quantumplethora
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  TrueHorizon-iOS:
    type: application
    platform: iOS
    sources: [TrueHorizon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantumplethora.TrueHorizon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: True Horizon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: True Horizon uses your location to calculate the Sun's true local position and sunrise.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
  TrueHorizon-macOS:
    type: application
    platform: macOS
    sources: [TrueHorizon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantumplethora.TrueHorizon.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: True Horizon
        INFOPLIST_KEY_NSLocationUsageDescription: True Horizon uses your location to calculate the Sun's true local position and sunrise.
    entitlements:
      path: TrueHorizon/TrueHorizon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.location: true
