<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timely Una</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Papyrus&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --card: #141b2d;
      --gold: #f4d35e;
      --orange: #f7931e;
      --text: #e8e6d9;
      --muted: #9a9a8c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Papyrus", "Segoe Print", "Bradley Hand", cursive;
      background: radial-gradient(ellipse at top, #1a2340 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    h1 {
      font-size: 2.8rem;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(244, 211, 94, 0.4);
      margin-bottom: 0.3rem;
      letter-spacing: 2px;
    }

    .tagline {
      font-size: 1.25rem;
      font-style: italic;
      color: var(--gold);
      margin-bottom: 2rem;
      text-align: center;
      max-width: 420px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(244, 211, 94, 0.25);
      border-radius: 16px;
      padding: 1.8rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    input[type="datetime-local"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 1.1rem;
      background: #0d1220;
      border: 1px solid rgba(244, 211, 94, 0.35);
      border-radius: 8px;
      color: var(--text);
      margin-bottom: 1.4rem;
    }

    button {
      font-family: inherit;
      font-size: 1.15rem;
      padding: 0.85rem 1.4rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--orange));
      color: #1a1200;
      font-weight: bold;
      box-shadow: 0 4px 18px rgba(244, 211, 94, 0.35);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      margin-top: 0.8rem;
    }

    /* Photon Labyrinth */
    #puzzle-section {
      display: none;
    }

    #puzzle-section.visible {
      display: block;
    }

    .puzzle-title {
      text-align: center;
      margin-bottom: 0.8rem;
      color: var(--gold);
      font-size: 1.3rem;
    }

    .puzzle-hint {
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 0 auto 1.2rem;
      max-width: 280px;
    }

    .cell {
      aspect-ratio: 1;
      background: #0d1220;
      border: 1px solid rgba(244, 211, 94, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .cell:hover {
      background: #1a2438;
    }

    .cell.mirror {
      background: #2a2200;
      color: var(--gold);
      border-color: var(--gold);
    }

    .cell.start {
      background: #1a3a1a;
      border-color: #4caf50;
    }

    .cell.end {
      background: #3a1a1a;
      border-color: #ef5350;
    }

    .cell.path {
      box-shadow: inset 0 0 12px rgba(244, 211, 94, 0.7);
    }

    /* Launch & Rocket Area */
    #launch-section {
      display: none;
      text-align: center;
    }

    #launch-section.visible {
      display: block;
    }

    #sky {
      position: relative;
      width: 100%;
      height: 260px;
      background: radial-gradient(ellipse at 50% 20%, #2a1a00 0%, #0a0e1a 70%);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(244, 211, 94, 0.2);
    }

    #sun {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at 35% 35%, #fff8e1, #ffeb3b 40%, #f7931e 80%);
      border-radius: 50%;
      box-shadow: 0 0 40px 12px rgba(255, 193, 7, 0.55);
    }

    #rocket {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.4rem;
      transition: all 3.8s cubic-bezier(0.25, 0.1, 0.25, 1);
      z-index: 5;
    }

    #rocket.launched {
      bottom: 180px;
      transform: translateX(-50%) scale(0.55);
      opacity: 0.3;
    }

    .result {
      margin-top: 1.2rem;
      padding: 1rem;
      background: rgba(244, 211, 94, 0.08);
      border-radius: 10px;
      border: 1px solid rgba(244, 211, 94, 0.2);
      font-size: 1.1rem;
      min-height: 4.5rem;
      white-space: pre-line;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Timely Una</h1>
  <p class="tagline">Because the Sun is always late to its own dawn ☀️</p>

  <div class="card">
    <label for="datetime">Choose a Moment in Time</label>
    <input type="datetime-local" id="datetime" />

    <button class="btn-primary" id="start-btn" onclick="startPuzzle()">
      Solve Photon Labyrinth
    </button>
  </div>

  <!-- Photon Labyrinth -->
  <div class="card" id="puzzle-section">
    <div class="puzzle-title">Photon Labyrinth</div>
    <p class="puzzle-hint">Tap cells to place / rotate mirrors.<br>Guide the photon from green (start) to red (exit).</p>
    
    <div id="grid"></div>

    <button class="btn-primary" id="check-btn" onclick="checkPath()">
      Check Photon Path
    </button>
    <button class="btn-secondary" onclick="resetPuzzle()">
      Reset Mirrors
    </button>
  </div>

  <!-- Launch Section -->
  <div class="card" id="launch-section">
    <div id="sky">
      <div id="sun"></div>
      <div id="rocket">🚀</div>
    </div>

    <button class="btn-primary" id="launch-btn" onclick="launchRocket()">
      Launch Baby X Rocket at the Sun
    </button>

    <div class="result" id="result"></div>
  </div>

  <footer>
    Timely Una • Light-time navigation
  </footer>

  <script>
    // ----- State -----
    let grid = Array(25).fill(0); // 0 empty, 1 = /
    let pathCells = [];
    let puzzleSolved = false;

    // ----- Init -----
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById("datetime").value = now.toISOString().slice(0, 16);

    buildGrid();

    function buildGrid() {
      const gridEl = document.getElementById("grid");
      gridEl.innerHTML = "";
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        if (i === 0) cell.classList.add("start");
        if (i === 24) cell.classList.add("end");
        cell.dataset.index = i;
        cell.onclick = () => toggleMirror(i);
        gridEl.appendChild(cell);
      }
      renderGrid();
    }

    function toggleMirror(i) {
      if (i === 0 || i === 24) return; // start & end locked
      grid[i] = grid[i] === 0 ? 1 : 0;
      renderGrid();
    }

    function renderGrid() {
      const cells = document.querySelectorAll(".cell");
      cells.forEach((cell, i) => {
        cell.classList.remove("mirror", "path");
        cell.textContent = "";
        if (grid[i] === 1) {
          cell.classList.add("mirror");
          cell.textContent = "/";
        }
        if (pathCells.includes(i)) {
          cell.classList.add("path");
        }
      });
    }

    function startPuzzle() {
      document.getElementById("puzzle-section").classList.add("visible");
      document.getElementById("start-btn").disabled = true;
      document.getElementById("launch-section").classList.remove("visible");
      document.getElementById("result").textContent = "";
      puzzleSolved = false;
      resetPuzzle();
    }

    function resetPuzzle() {
      grid = Array(25).fill(0);
      pathCells = [];
      renderGrid();
    }

    // Very simple path check: if at least 4 mirrors are placed, we accept it for the demo
    // (You can expand this later into real ray-tracing logic)
    function checkPath() {
      const mirrorCount = grid.filter(v => v === 1).length;
      if (mirrorCount >= 4) {
        // Fake a successful path for demonstration
        pathCells = [0, 6, 12, 18, 24];
        renderGrid();
        puzzleSolved = true;
        setTimeout(() => {
          document.getElementById("launch-section").classList.add("visible");
          document.getElementById("puzzle-section").classList.remove("visible");
        }, 600);
      } else {
        alert("Place at least 4 mirrors to create a continuous path for the photon.");
      }
    }

    function launchRocket() {
      if (!puzzleSolved) return;

      const rocket = document.getElementById("rocket");
      rocket.classList.remove("launched");
      // force reflow
      void rocket.offsetWidth;
      rocket.classList.add("launched");

      // Calculate light-time delay
      const selected = new Date(document.getElementById("datetime").value);
      const lightDelaySeconds = 8 * 60 + 19; // 8 min 19 sec
      const arrival = new Date(selected.getTime() - lightDelaySeconds * 1000);

      const options = {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      };

      const resultText =
        "🚀 Rocket synchronized with the Sun's position\n" +
        "Light left at " + arrival.toLocaleString(undefined, options) + "\n" +
        "Navigating the true time of arrival.";

      setTimeout(() => {
        document.getElementById("result").textContent = resultText;
      }, 1800);
    }
  </script>
</body>
</html>
